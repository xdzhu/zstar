name: Build and publish GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m pip install -e . pytest "phonopy==4.4.0"
          python -m pytest -q
          python -m build
          python -m twine check dist/*

      - name: Read versioned change summary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')
          lines = Path('CHANGELOG.md').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.startswith(f'## {version} -'))
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith('## ')), len(lines))
          notes = '\n'.join(lines[start + 1:end]).strip()
          Path('release-notes.md').write_text(
              f'Artifacts built and tested from `{tag}`. Examples are in the tagged source repository, not the wheel.\n\n{notes}\n')
          PY

      - name: Create GitHub release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: ZStar ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
