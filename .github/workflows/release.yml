name: Build and publish GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Create GitHub release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: ZStar ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Automated release for `${{ github.ref_name }}`.

            GitHub generated the change summary below from commits and pull requests since the previous release. The attached wheel and source distribution were built from this tag.
          files: |
            dist/*.whl
            dist/*.tar.gz
