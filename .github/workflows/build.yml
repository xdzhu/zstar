name: Build package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        phonopy: ["2.36.0", "4.4.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tested dependency profile
        run: python -m pip install -e . pytest "phonopy==${{ matrix.phonopy }}"
      - name: Run package regressions
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check wheel contents
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              leaked = [name for name in archive.namelist() if name.startswith("examples/")]
          assert not leaked, leaked
          print(f"verified {wheels[0]}")
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zstar-distributions-${{ github.sha }}
          path: dist/*
