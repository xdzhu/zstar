[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zstar"
version = "0.2.0"
description = "Workflows for polarization, Born effective charges, dielectric response, and vibrational spectroscopy."
readme = "README_PYPI.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
keywords = [
  "born-effective-charge",
  "polarization",
  "dielectric-response",
  "infrared",
  "raman",
  "materials-science"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics"
]

authors = [
  { name = "Xudong Zhu", email = "zhuxudong@ustc.edu.cn" }
]


dependencies = [
  "numpy>=1.26",
  "scipy>=1.10",
  "PyYAML>=5.4",
  "matplotlib>=3.3",
  "spglib>=2.6.0",
  "phonopy>=2.36",
  "pymatgen>=2024.0.0",
  "tomli>=2.0; python_version<'3.11'"
]


[project.urls]
Homepage = "https://github.com/xdzhu/zstar"
Repository = "https://github.com/xdzhu/zstar"

[project.scripts]
zstar = "zstar.cli:zstar_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["zstar", "zstar.*"]
namespaces = false

[tool.setuptools.package-data]
zstar = [
  "agent_skills/run-zstar-workflows/SKILL.md",
  "agent_skills/run-zstar-workflows/agents/*.yaml",
  "agent_skills/run-zstar-workflows/references/*.md",
  "agent_skills/run-zstar-workflows/scripts/*.py"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
